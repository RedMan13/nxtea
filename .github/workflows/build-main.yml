on: 
  workflow_dispatch:
  repository_dispatch:
  push:

permissions:
  contents: read

concurrency: 
  group: "deploy"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
      - name: Install dependencies and build site
        run: |
          npm i
          npm run build
          node ./save-modules.js
      - name: Push main page to Site
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: 's3.serv00.com'
          username: 'godslayerakp'
          password: '${{ secrets.SSH_PASSWORD }}'
          local_path: './nxtea'
          remote_path: '/usr/home/godslayerakp/domains/godslayerakp.gay/public_nodejs/dist'
  win-pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
      - name: Install dependencies and package
        run: |
          npm install -g node-gyp@v12.1.0
          npm i --omit=dev
          node ./save-modules.js
      - name: Push main page to Site
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: 's3.serv00.com'
          username: 'godslayerakp'
          password: '${{ secrets.SSH_PASSWORD }}'
          local_path: './nxtea/win32.modules.zip'
          remote_path: '/usr/home/godslayerakp/domains/godslayerakp.gay/public_nodejs/dist/win32.modules.zip'
